<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US Cities Search</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>US Cities Search</h1>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Search by City or ZIP Code..." autocomplete="off">
            <button id="search-button">Search</button>
        </div>
        
        <div id="radioactive-alert" class="radioactive-container hidden">
            <div class="radioactive-warning">
                ☢️ CITY NOT FOUND! ☢️
            </div>
        </div>

        <div id="results" class="results-container">
            <!-- Results will be injected here -->
        </div>
    </div>
    <script src="client.js"></script>
</body>
</html>
